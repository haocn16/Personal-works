<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Luxury Tree - Ultimate Edition</title>
    <style>
        body {
            margin: 0; overflow: hidden; background-color: #020202;
            font-family: 'Times New Roman', serif;
        }
        #canvas-container { width: 100vw; height: 100vh; display: block; }

        /* UI */
        #ui {
            position: absolute; top: 40px; left: 40px;
            pointer-events: none; z-index: 10; text-transform: uppercase;
        }
        h1 {
            margin: 0; font-size: 3.5rem; color: #D4AF37;
            text-shadow: 0 0 30px rgba(212,175,55,0.4);
            letter-spacing: 5px; font-weight: 400;
        }
        h2 {
            margin: 5px 0 0 0; font-size: 0.9rem; color: #50c878;
            letter-spacing: 4px; font-family: sans-serif; opacity: 0.9;
        }

        /* 摄像头反馈 */
        #camera-wrapper {
            position: absolute; bottom: 30px; right: 30px;
            width: 160px; height: 120px;
            border: 1px solid rgba(212,175,55,0.3);
            border-radius: 4px;
            overflow: hidden; opacity: 0.8;
            transform: scaleX(-1); z-index: 20; background: #000;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        #input-video { width: 100%; height: 100%; object-fit: cover; }

        /* 状态条 */
        #status-bar {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            text-align: center; font-family: monospace; color: #D4AF37;
            background: linear-gradient(90deg, transparent, rgba(0,0,0,0.8), transparent);
            padding: 10px 40px; border-top: 1px solid rgba(212,175,55,0.5);
            pointer-events: none; letter-spacing: 2px;
        }

        #loader {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #D4AF37; font-size: 14px; font-family: monospace;
            text-align: center; transition: opacity 0.5s; pointer-events: none;
            border: 1px solid #D4AF37; padding: 20px;
        }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="ui">
        <h1>Grand Luxury</h1>
        <h2>Cinematic Interactive Experience</h2>
    </div>

    <div id="status-bar">
        SYSTEM STATUS: <span id="gesture-display" style="color:#666">INITIALIZING...</span>
    </div>

    <div id="camera-wrapper">
        <video id="input-video"></video>
    </div>

    <div id="loader">LOADING AI VISION MODELS...</div>
    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // --- 全局状态 ---
        const STATE = {
            isUnleashed: false,
            handX: 0, handY: 0,
            progress: 1.0 // 1.0 = Tree, 0.0 = Chaos
        };

        const CONFIG = {
            count: 3500,        // 粒子数
            ornaments: 100,     // 球体数
            gifts: 40,          // 礼物盒数
            photos: 24,         // 拍立得数
            colorLeaf: new THREE.Color("#003318"), // 更深的祖母绿
            colorGold: new THREE.Color("#FFC800"), // 温暖的黄金
        };

        // ==========================================
        // 1. 辅助函数：生成纹理与坐标
        // ==========================================

        // 生成拍立得纹理 (Canvas)
        function createPolaroidTexture(index) {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 300;
            const ctx = canvas.getContext('2d');

            // 白底
            ctx.fillStyle = '#fdfdfd';
            ctx.fillRect(0, 0, 256, 300);

            // 阴影
            ctx.fillStyle = '#ddd';
            ctx.fillRect(0, 250, 256, 1);

            // 照片区域 (生成随机抽象艺术)
            const hue = (index * 45) % 360;
            const gradient = ctx.createLinearGradient(20, 20, 236, 236);
            gradient.addColorStop(0, `hsl(${hue}, 60%, 50%)`);
            gradient.addColorStop(1, `hsl(${hue + 40}, 60%, 30%)`);
            ctx.fillStyle = gradient;
            ctx.fillRect(20, 20, 216, 216);

            // 噪点纹理
            ctx.fillStyle = 'rgba(255,255,255,0.1)';
            for(let i=0; i<50; i++) {
                ctx.beginPath();
                ctx.arc(Math.random()*216+20, Math.random()*216+20, Math.random()*10, 0, Math.PI*2);
                ctx.fill();
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.colorSpace = THREE.SRGBColorSpace;
            return texture;
        }

        function getChaosPos(r) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const rad = Math.cbrt(Math.random()) * r;
            return new THREE.Vector3(
                rad * Math.sin(phi) * Math.cos(theta),
                rad * Math.sin(phi) * Math.sin(theta),
                rad * Math.cos(phi)
            );
        }

        function getTreePos(i, total, radiusBase, height, yOffset = 0) {
            const y = (i / total) * height;
            const radius = (1 - y / height) * radiusBase;
            const angle = i * 2.399; // 黄金角
            return new THREE.Vector3(
                Math.cos(angle) * radius,
                y - height / 2 + yOffset,
                Math.sin(angle) * radius
            );
        }

        // ==========================================
        // 2. 场景与视觉效果
        // ==========================================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x020202, 0.025); // 深色雾

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        const baseCamPos = new THREE.Vector3(0, 4, 22);
        camera.position.copy(baseCamPos);

        const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ReinhardToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        // --- 电影级灯光 ---
        scene.add(new THREE.AmbientLight(0xffffff, 0.1)); // 微弱环境光

        // 主光 (暖金)
        const mainSpot = new THREE.SpotLight(0xffd700, 80);
        mainSpot.position.set(10, 20, 10);
        mainSpot.angle = 0.6;
        mainSpot.penumbra = 0.5;
        mainSpot.decay = 1.5;
        scene.add(mainSpot);

        // 轮廓光 (冷蓝) - 制造对比度，关键！
        const rimLight = new THREE.SpotLight(0x4455ff, 50);
        rimLight.position.set(-15, 10, -5);
        rimLight.lookAt(0,0,0);
        scene.add(rimLight);

        // 底部填充光
        scene.add(new THREE.PointLight(0xffaa00, 2, 15).translateX(0).translateY(-4).translateZ(2));

        // --- 3.1 针叶系统 (Shader Particles) ---
        const leafGeo = new THREE.BufferGeometry();
        const chaosPos = [], targetPos = [], randoms = [];
        for (let i = 0; i < CONFIG.count; i++) {
            const c = getChaosPos(16);
            const t = getTreePos(i, CONFIG.count, 4.5, 11);
            chaosPos.push(c.x, c.y, c.z);
            targetPos.push(t.x, t.y, t.z);
            randoms.push(Math.random());
        }
        leafGeo.setAttribute('position', new THREE.Float32BufferAttribute(chaosPos, 3));
        leafGeo.setAttribute('aChaosPos', new THREE.Float32BufferAttribute(chaosPos, 3));
        leafGeo.setAttribute('aTargetPos', new THREE.Float32BufferAttribute(targetPos, 3));
        leafGeo.setAttribute('aRandom', new THREE.Float32BufferAttribute(randoms, 1));

        const leafMat = new THREE.ShaderMaterial({
            uniforms: {
                uTime: { value: 0 },
                uProgress: { value: 1.0 },
                uColor: { value: CONFIG.colorLeaf },
                uGold: { value: CONFIG.colorGold }
            },
            vertexShader: `
                uniform float uTime; uniform float uProgress;
                attribute vec3 aChaosPos; attribute vec3 aTargetPos; attribute float aRandom;
                varying float vBlink;
                float cubicInOut(float t) { return t < 0.5 ? 4.0 * t * t * t : 0.5 * pow(2.0 * t - 2.0, 3.0) + 1.0; }
                void main() {
                    vBlink = sin(uTime * 2.5 + aRandom * 15.0);
                    float t = cubicInOut(uProgress);
                    vec3 pos = mix(aChaosPos, aTargetPos, t);
                    // 螺旋上升动态
                    pos.y += sin(uTime + aRandom * 10.0) * 0.15 * (1.0 - t);
                    vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                    gl_PointSize = (140.0 * aRandom + 40.0) / -mvPosition.z;
                    gl_Position = projectionMatrix * mvPosition;
                }
            `,
            fragmentShader: `
                uniform vec3 uColor; uniform vec3 uGold; varying float vBlink;
                void main() {
                    float r = distance(gl_PointCoord, vec2(0.5));
                    if (r > 0.5) discard;
                    float sparkle = smoothstep(0.9, 1.0, vBlink); // 只让很少的粒子闪金光
                    vec3 finalColor = mix(uColor, uGold, sparkle);
                    float glow = 1.0 - (r * 2.0);
                    gl_FragColor = vec4(finalColor * pow(glow, 2.0) * 2.5, 1.0);
                }
            `,
            transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
        });
        scene.add(new THREE.Points(leafGeo, leafMat));

        // --- 3.2 装饰球 & 3.3 礼物盒 & 3.4 拍立得 ---
        const objects = [];
        const dynamicGroup = new THREE.Group();
        scene.add(dynamicGroup);

        // 材质
        const matSphereGold = new THREE.MeshStandardMaterial({ color: 0xFFD700, metalness: 0.9, roughness: 0.1 });
        const matSphereRed = new THREE.MeshStandardMaterial({ color: 0x8B0000, metalness: 0.7, roughness: 0.2 });
        const matGiftGold = new THREE.MeshStandardMaterial({ color: 0xD4AF37, metalness: 0.8, roughness: 0.2 });
        const matGiftRed = new THREE.MeshStandardMaterial({ color: 0x660000, metalness: 0.4, roughness: 0.3 });

        // A. 装饰球
        const sphereGeo = new THREE.SphereGeometry(0.25, 32, 32);
        for(let i=0; i<CONFIG.ornaments; i++){
            const mesh = new THREE.Mesh(sphereGeo, Math.random()>0.4 ? matSphereGold : matSphereRed);
            const tRaw = getTreePos(i, CONFIG.ornaments, 4.6, 10.5);
            objects.push({
                mesh,
                chaos: getChaosPos(18),
                target: new THREE.Vector3(tRaw.x, tRaw.y + (Math.random()-0.5), tRaw.z),
                type: 'sphere',
                rotSpeed: Math.random()
            });
            dynamicGroup.add(mesh);
        }

        // B. 礼物盒 (主要分布在树底部)
        const boxGeo = new THREE.BoxGeometry(1, 1, 1);
        for(let i=0; i<CONFIG.gifts; i++){
            const isGold = Math.random() > 0.5;
            const mesh = new THREE.Mesh(boxGeo, isGold ? matGiftGold : matGiftRed);

            // 礼物盒分布逻辑：底部圆环 + 少量随机
            const angle = Math.random() * Math.PI * 2;
            const r = 2.5 + Math.random() * 3.0; // 底部半径
            const tPos = new THREE.Vector3(Math.cos(angle)*r, -5.5 + Math.random()*1.5, Math.sin(angle)*r);

            // 随机大小
            const scale = 0.4 + Math.random() * 0.5;
            mesh.scale.set(scale, scale * (1 + Math.random()), scale); // 有高有矮

            objects.push({
                mesh,
                chaos: getChaosPos(20),
                target: tPos,
                type: 'gift',
                rotSpeed: Math.random()
            });
            dynamicGroup.add(mesh);
        }

        // C. 拍立得 (螺旋分布)
        const planeGeo = new THREE.PlaneGeometry(0.8, 1.0);
        for(let i=0; i<CONFIG.photos; i++){
            const matPhoto = new THREE.MeshBasicMaterial({
                map: createPolaroidTexture(i),
                side: THREE.DoubleSide
            });
            const mesh = new THREE.Mesh(planeGeo, matPhoto);

            // 螺旋位置
            const tRaw = getTreePos(i, CONFIG.photos, 4.0, 9.0);

            objects.push({
                mesh,
                chaos: getChaosPos(14),
                target: tRaw,
                type: 'photo',
                rotSpeed: Math.random()
            });
            dynamicGroup.add(mesh);
        }

        // D. 树顶星
        const star = new THREE.Mesh(new THREE.OctahedronGeometry(0.8, 0), new THREE.MeshBasicMaterial({color:0xffffee}));
        star.position.set(0, 6, 0);
        scene.add(star);
        const starLight = new THREE.PointLight(0xffd700, 2, 20);
        starLight.position.set(0,6,0);
        scene.add(starLight);

        // --- 后期处理 (优化后的辉光) ---
        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));

        // 参数调整：threshold 提高(只亮的地方发光), strength 降低(不刺眼), radius 增大(柔和)
        const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.0, 0.9, 0.7);
        composer.addPass(bloom);

        // ==========================================
        // 4. AI 交互逻辑 (MediaPipe)
        // ==========================================
        const videoElement = document.getElementById('input-video');
        const gestureDisplay = document.getElementById('gesture-display');
        const loader = document.getElementById('loader');

        function onResults(results) {
            loader.style.opacity = '0';
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                const centerX = (landmarks[0].x + landmarks[9].x) / 2;
                const centerY = (landmarks[0].y + landmarks[9].y) / 2;
                STATE.handX = (centerX - 0.5) * -2;
                STATE.handY = -(centerY - 0.5) * 2;

                const wrist = landmarks[0];
                const middleTip = landmarks[12];
                const indexTip = landmarks[8];
                const dist = Math.sqrt(Math.pow(middleTip.x - wrist.x, 2) + Math.pow(middleTip.y - wrist.y, 2));

                if (dist < 0.25) {
                    STATE.isUnleashed = false;
                    gestureDisplay.innerHTML = "<span style='color:#50c878'>TREE FORMED</span> (Closed Hand)";
                    gestureDisplay.style.borderColor = "#50c878";
                } else {
                    STATE.isUnleashed = true;
                    gestureDisplay.innerHTML = "<span style='color:#ff4444'>CHAOS UNLEASHED</span> (Open Hand)";
                    gestureDisplay.style.borderColor = "#ff4444";
                }
            } else {
                gestureDisplay.innerHTML = "NO HAND DETECTED";
                gestureDisplay.style.borderColor = "#666";
            }
        }

        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
        hands.onResults(onResults);

        const cameraUtils = new Camera(videoElement, {
            onFrame: async () => await hands.send({image: videoElement}),
            width: 640, height: 480
        });
        cameraUtils.start();

        // ==========================================
        // 5. 动画循环
        // ==========================================
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            // 状态机插值
            const targetP = STATE.isUnleashed ? 0.0 : 1.0;
            const speed = STATE.isUnleashed ? 1.5 : 0.8; // 炸开快，聚合优雅地慢
            if (Math.abs(STATE.progress - targetP) > 0.001) {
                STATE.progress += (targetP - STATE.progress) * speed * delta;
            }

            // 相机视差
            const camX = baseCamPos.x + (STATE.handX * 8);
            const camY = baseCamPos.y + (STATE.handY * 4);
            camera.position.x += (camX - camera.position.x) * 0.05;
            camera.position.y += (camY - camera.position.y) * 0.05;
            camera.lookAt(0, 3, 0);

            // 更新 Shader
            leafMat.uniforms.uTime.value = time;
            leafMat.uniforms.uProgress.value = STATE.progress;

            // 更新实体物件
            objects.forEach(o => {
                // 位置插值
                o.mesh.position.lerpVectors(o.chaos, o.target, STATE.progress);

                if (STATE.progress < 0.2) {
                    // Chaos 状态：所有物体缓慢自转，像失重一样
                    o.mesh.rotation.x += delta * o.rotSpeed;
                    o.mesh.rotation.z += delta * o.rotSpeed;
                } else if (STATE.progress > 0.8) {
                    // Tree 状态：
                    if (o.type === 'photo') {
                        // 拍立得面向中心
                        o.mesh.lookAt(0, o.mesh.position.y, 0);
                        // 微微摆动，像挂在树上
                        o.mesh.rotation.z += Math.sin(time * 2 + o.rotSpeed * 10) * 0.002;
                    } else if (o.type === 'sphere') {
                        // 装饰球复位
                        o.mesh.rotation.set(0,0,0);
                    } else if (o.type === 'gift') {
                        // 礼物盒落地摆正
                        o.mesh.rotation.set(0, o.rotSpeed * 6.28, 0);
                    }
                }
            });

            // 星星特效
            star.rotation.y = time * 0.5;
            star.scale.setScalar(STATE.progress > 0.8 ? 1 + Math.sin(time*3)*0.1 : STATE.progress);

            composer.render();
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
