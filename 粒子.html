<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js 粒子系统 - 全方位手势控制</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Segoe UI', sans-serif; }
        canvas { display: block; }

        #input_video { position: absolute; top: 0; left: 0; z-index: -1; visibility: hidden; width: 320px; height: 240px; }

        /* UI 容器 */
        #ui-container { position: absolute; top: 20px; right: 20px; z-index: 10; }

        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: white; font-size: 24px; pointer-events: none; text-align: center;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
            transition: opacity 0.5s;
        }

        .fullscreen-btn {
            position: absolute; bottom: 20px; right: 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white; padding: 10px 20px; cursor: pointer;
            border-radius: 20px; backdrop-filter: blur(5px);
            transition: all 0.3s ease; text-transform: uppercase; letter-spacing: 1px; font-size: 12px;
        }
        .fullscreen-btn:hover { background: rgba(255, 255, 255, 0.3); transform: scale(1.05); }

        #cam-preview {
            position: absolute; bottom: 20px; left: 20px;
            width: 160px; height: 120px; border-radius: 10px;
            opacity: 0.6; border: 1px solid #444; transform: scaleX(-1);
            z-index: 5; pointer-events: none;
            box-shadow: 0 0 15px rgba(0,255,255,0.2);
        }
    </style>

    <!-- 引入库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.17.0/dist/lil-gui.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="loading">
        正在初始化系统...<br>
        <span style="font-size:14px; opacity:0.7">请举起手掌控制：<br>张合=缩放/扩散，移动=上下左右</span>
    </div>

    <video id="input_video"></video>
    <canvas id="cam-preview"></canvas>
    <button class="fullscreen-btn" id="fs-btn">进入全屏</button>

    <script>
        // ================= 配置与状态 =================
        const config = {
            particleCount: 20000,
            particleSize: 0.15,
            model: 'saturn',
            color: '#00ffff',
            handSensitivity: 2.0, // 扩散灵敏度
            moveSpeed: 0.1,       // 移动跟随的平滑度 (越小越平滑但有延迟)
            moveRange: 25         // 手势移动对应的屏幕范围
        };

        const state = {
            handOpenness: 0,   // 张合程度 (0-1)
            handX: 0,          // 手掌目标位置 X (-1 到 1)
            handY: 0,          // 手掌目标位置 Y (-1 到 1)

            // 用于平滑动画的当前值
            currOpenness: 0,
            currSystemX: 0,
            currSystemY: 0,

            targetPositions: [],
            currentPositions: []
        };

        // ================= Three.js 初始化 =================
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.02);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 30;
        camera.position.y = 0; // 此时y设为0，便于上下移动观察
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const camCanvas = document.getElementById('cam-preview');
        const camCtx = camCanvas.getContext('2d');

        // ================= 粒子系统核心 =================
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(config.particleCount * 3);

        for (let i = 0; i < config.particleCount; i++) {
            positions[i * 3] = (Math.random() - 0.5) * 50;
            positions[i * 3 + 1] = (Math.random() - 0.5) * 50;
            positions[i * 3 + 2] = (Math.random() - 0.5) * 50;

            state.currentPositions.push({
                x: positions[i*3], y: positions[i*3+1], z: positions[i*3+2]
            });
            state.targetPositions.push({x:0, y:0, z:0});
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

        const sprite = new THREE.TextureLoader().load('https://threejs.org/examples/textures/sprites/disc.png');
        const material = new THREE.PointsMaterial({
            color: config.color,
            size: config.particleSize,
            map: sprite,
            transparent: true,
            opacity: 0.8,
            sizeAttenuation: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const particleSystem = new THREE.Points(geometry, material);
        scene.add(particleSystem);

        // ================= 模型生成算法 =================
        function calculateTargets(modelType) {
            const count = config.particleCount;
            const targets = [];

            for (let i = 0; i < count; i++) {
                let x, y, z;

                if (modelType === 'saturn') {
                    const isRing = Math.random() > 0.35;
                    if (isRing) {
                        const angle = Math.random() * Math.PI * 2;
                        const radius = 10 + Math.random() * 6;
                        x = Math.cos(angle) * radius;
                        z = Math.sin(angle) * radius;
                        y = (Math.random() - 0.5) * 0.5;
                    } else {
                        const r = 5;
                        const theta = Math.random() * Math.PI * 2;
                        const phi = Math.acos((Math.random() * 2) - 1);
                        x = r * Math.sin(phi) * Math.cos(theta);
                        y = r * Math.sin(phi) * Math.sin(theta);
                        z = r * Math.cos(phi);
                    }
                    // 倾斜
                    const tilt = 0.4;
                    const tempY = y * Math.cos(tilt) - z * Math.sin(tilt);
                    const tempZ = y * Math.sin(tilt) + z * Math.cos(tilt);
                    y = tempY; z = tempZ;

                } else if (modelType === 'firework') {
                    const r = Math.pow(Math.random(), 1/3) * 15;
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos((Math.random() * 2) - 1);
                    x = r * Math.sin(phi) * Math.cos(theta);
                    y = r * Math.sin(phi) * Math.sin(theta);
                    z = r * Math.cos(phi);

                } else if (modelType === 'ocean') {
                    const side = Math.sqrt(count);
                    const u = (i % side) / side;
                    const v = Math.floor(i / side) / side;
                    x = (u - 0.5) * 50;
                    z = (v - 0.5) * 40;
                    y = 0; // 高度在动画循环中动态计算

                } else if (modelType === 'tree') {
                    const h = 25;
                    const t = i / count;
                    const angle = t * 30 * Math.PI;
                    const radius = (1 - t) * 8;
                    x = Math.cos(angle) * radius;
                    z = Math.sin(angle) * radius;
                    y = (t - 0.5) * h;
                    x += (Math.random() - 0.5);
                    z += (Math.random() - 0.5);
                    y += (Math.random() - 0.5);
                }
                targets.push({x, y, z});
            }
            return targets;
        }
        state.targetPositions = calculateTargets(config.model);

        // ================= UI 控制 =================
        const gui = new lil.GUI({ title: '控制台' });
        gui.add(config, 'model', { '🪐 土星': 'saturn', '🎆 烟花': 'firework', '🌊 山水': 'ocean', '🎄 圣诞树': 'tree' })
           .onChange(val => state.targetPositions = calculateTargets(val));
        gui.addColor(config, 'color').onChange(val => material.color.set(val));
        gui.add(config, 'particleSize', 0.05, 0.5);

        // ================= MediaPipe 手势识别逻辑 (更新版) =================
        const videoElement = document.getElementById('input_video');

        function onResults(results) {
            camCanvas.width = videoElement.videoWidth;
            camCanvas.height = videoElement.videoHeight;
            camCtx.save();
            camCtx.clearRect(0, 0, camCanvas.width, camCanvas.height);
            camCtx.drawImage(results.image, 0, 0, camCanvas.width, camCanvas.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                drawConnectors(camCtx, landmarks, HAND_CONNECTIONS, {color: '#00FF00', lineWidth: 2});

                // 1. 计算张合 (使用食指与拇指距离)
                const thumb = landmarks[4];
                const index = landmarks[8];
                const wrist = landmarks[0];
                const middle = landmarks[9]; // 中指根部（指关节）

                const dist = (p1, p2) => Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2));
                const pinchDist = dist(thumb, index);
                const handSize = dist(wrist, middle) * 1.5;

                let openness = pinchDist / handSize;
                openness = (openness - 0.2) * 2.5;
                state.handOpenness = Math.max(0, Math.min(1, openness));

                // 2. 计算位置 (上下左右)
                // 使用中指根部(9)作为手掌中心，比较稳定
                // MediaPipe x: 0(左) -> 1(右), y: 0(上) -> 1(下)

                // 注意：摄像头默认是镜像的，所以我们这里做反转处理，让操作更符合直觉
                // 手往右移(屏幕上是左边)，x变小 -> 我们希望x变大(向右)
                // 因此: (1 - x) 是去镜像

                // 映射到 -1 到 1 的范围
                const centerX = (1 - middle.x) * 2 - 1;
                const centerY = (1 - middle.y) * 2 - 1;

                state.handX = centerX;
                state.handY = centerY; // MediaPipe y向下为正，ThreeJS y向上为正，后面乘以正数需注意方向

                document.getElementById('loading').style.opacity = 0;
            } else {
                // 如果没有手，归位
                state.handOpenness *= 0.9;
                state.handX *= 0.95;
                state.handY *= 0.95;
            }
            camCtx.restore();
        }

        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
        hands.onResults(onResults);

        const cameraUtils = new Camera(videoElement, {
            onFrame: async () => await hands.send({image: videoElement}),
            width: 320, height: 240
        });
        cameraUtils.start();

        // ================= 动画循环 (核心逻辑) =================
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            // --- 1. 处理全局移动 (上下左右) ---
            // 使用 Lerp (线性插值) 让移动更平滑
            state.currSystemX += (state.handX * config.moveRange - state.currSystemX) * config.moveSpeed;
            state.currSystemY += (state.handY * config.moveRange - state.currSystemY) * config.moveSpeed;

            // 移动整个粒子系统容器
            particleSystem.position.x = state.currSystemX;
            particleSystem.position.y = state.currSystemY;

            // 增加一点互动的倾斜感 (向左移时，物体稍微向左倾斜)
            particleSystem.rotation.y = state.currSystemX * 0.02;
            particleSystem.rotation.x = -state.currSystemY * 0.02;

            // --- 2. 处理粒子扩散 (张合) ---
            // 平滑张合值
            state.currOpenness += (state.handOpenness - state.currOpenness) * 0.1;

            const expansionFactor = 1 + state.currOpenness * config.handSensitivity;
            const scatterFactor = state.currOpenness * 5.0;

            const positionsAttribute = geometry.attributes.position;
            const array = positionsAttribute.array;
            const isOcean = config.model === 'ocean';

            for (let i = 0; i < config.particleCount; i++) {
                const target = state.targetPositions[i];
                const current = state.currentPositions[i];

                let tx = target.x;
                let ty = target.y;
                let tz = target.z;

                // 海洋特殊波动逻辑
                if (isOcean) {
                    ty = Math.sin(tx * 0.2 + time) * 1.5 + Math.cos(tz * 0.1 + time * 0.8) * 1.5;
                    // 加入一些高频波动模拟“浪花”
                    if (Math.abs(tx) > 10) ty += Math.sin(tx * 0.5 + tz * 0.5 + time * 2) * 0.5;
                    ty -= 5;
                }

                // 粒子自转 (公转)
                const rotSpeed = 0.1;
                const cosR = Math.cos(time * rotSpeed * 0.5);
                const sinR = Math.sin(time * rotSpeed * 0.5);

                // 基础旋转位置
                const rotX = tx * cosR - tz * sinR;
                const rotZ = tx * sinR + tz * cosR;

                // 应用手势扩散 (基于原点向外)
                let finalX = rotX * expansionFactor;
                let finalY = ty * expansionFactor;
                let finalZ = rotZ * expansionFactor;

                // 扩散时的噪点抖动
                if (scatterFactor > 0.1) {
                    finalX += (Math.random() - 0.5) * scatterFactor;
                    finalY += (Math.random() - 0.5) * scatterFactor;
                    finalZ += (Math.random() - 0.5) * scatterFactor;
                }

                // 物理跟随 (Lerp)
                current.x += (finalX - current.x) * 0.1;
                current.y += (finalY - current.y) * 0.1;
                current.z += (finalZ - current.z) * 0.1;

                array[i * 3] = current.x;
                array[i * 3 + 1] = current.y;
                array[i * 3 + 2] = current.z;
            }

            positionsAttribute.needsUpdate = true;
            renderer.render(scene, camera);
        }

        animate();

        // ================= 辅助事件 =================
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        const fsBtn = document.getElementById('fs-btn');
        fsBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else if (document.exitFullscreen) document.exitFullscreen();
        });

    </script>
</body>
</html>
